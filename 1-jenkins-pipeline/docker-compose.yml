name: tase-jenkins

services:
  # Artifact repository: the pipeline uploads the jar to maven-releases (D-010, D-012).
  nexus:
    image: sonatype/nexus3:3.98.1
    environment:
      # Replaces the image default, so the userRoot setting from the default is kept.
      # Heap 1 GB + direct memory 512 MB instead of 2703m each (too much for this laptop).
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms1g -Xmx1g -XX:MaxDirectMemorySize=512m
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    mem_limit: 2g
    ports:
      # Bound to localhost only: not reachable from the network.
      - "127.0.0.1:8081:8081"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      # Returns 200 only when Nexus can accept writes (uploads), not just reads.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/service/rest/v1/status/writable"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start creates the database: measured ~4 minutes, so leave a margin.
      start_period: 300s

volumes:
  nexus-data:
